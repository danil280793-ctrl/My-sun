<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твои Суперспособности!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Узнай свои суперспособности!</h1>
            <p>Пройди этот большой квест (25 вопросов!), чтобы узнать, в чем ты настоящий мастер.</p>
        </header>
        
        <main>
            <div id="start-screen">
                <button id="start-btn" class="btn primary-btn">Начать приключение!</button>
            </div>

            <div id="quiz-screen" class="hidden">
                <div class="progress-bar">
                    <div id="progress"></div>
                </div>
                <h2 id="question-text">Вопрос</h2>
                <div id="options-container" class="options-grid"></div>
                <div id="question-counter" style="margin-top: 15px; color: #888; font-size: 0.9em;">Вопрос 1 из 25</div>
            </div>

            <div id="result-screen" class="hidden">
                <h2>Твой результат:</h2>
                <div class="result-card">
                    <div id="result-icon">🌟</div>
                    <h3 id="result-title">Талант</h3>
                    <p id="result-desc">Описание</p>
                </div>
                <div class="parents-note">
                    <strong>💡 Рекомендация для родителей:</strong>
                    <p id="parents-recommendation"></p>
                </div>
                
                <div class="detailed-scores" id="detailed-scores" style="margin-top: 20px; text-align: left; background: #f8f9fa; padding: 15px; border-radius: 10px;">
                    <!-- Здесь будет статистика по всем шкалам -->
                </div>

                <button id="restart-btn" class="btn secondary-btn">Пройти еще раз</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
